<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AJI Collab — chargement sécurisé</title>
  <style>body{font-family:system-ui,sans-serif;background:#111827;color:#f9fafb;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:680px;padding:32px}.muted{color:#9ca3af}pre{white-space:pre-wrap;color:#fecaca}</style>
</head>
<body>
  <div class="box"><h1>AJI Collab</h1><p id="status" class="muted">Chargement de l’application…</p><pre id="error"></pre></div>
  <script>
  (async()=>{
    const status=document.getElementById('status'), error=document.getElementById('error');
    const bundleUrl='./aji-collab.bundle.gz?v=gzip-r1';
    function xhrArrayBuffer(url){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('GET',url,true);x.responseType='arraybuffer';x.withCredentials=true;x.onload=()=>x.status>=200&&x.status<300?resolve(x.response):reject(new Error('Bundle indisponible (HTTP '+x.status+').'));x.onerror=()=>reject(new Error('Échec réseau lors du chargement du bundle.'));x.send()})}
    try{
      if(typeof DecompressionStream!=='function') throw new Error('Navigateur incompatible : décompression gzip indisponible.');
      let body;
      try{
        const r=await fetch(bundleUrl,{cache:'no-store',credentials:'same-origin'});
        if(!r.ok) throw new Error('Bundle indisponible (HTTP '+r.status+').');
        body=r.body;
      }catch(fetchError){
        status.textContent='Nouvelle tentative de chargement…';
        const buffer=await xhrArrayBuffer(bundleUrl);
        body=new Blob([buffer]).stream();
      }
      const html=await new Response(body.pipeThrough(new DecompressionStream('gzip'))).text();
      if(!html.includes('aji-collab-v2/2.2.0')) throw new Error('Bundle AJI Collab invalide ou inattendu.');
      const quotaTag='<script src="./quota-repair.js?v=quota-r1"><'+'/script>';
      const patched=html.includes('</body>')?html.replace('</body>',quotaTag+'</body>'):html+quotaTag;
      document.open(); document.write(patched); document.close();
    }catch(e){status.textContent='Chargement impossible.';error.textContent=String(e&&e.message||e)+'\n\nEssaie un rechargement forcé (Ctrl+F5).'}
  })();
  </script>
</body>
</html>
